name: Docker

on:
  workflow_dispatch:
  push:
    branches:
      [ main, develop ]
    paths:
      - 'R/**'
      - 'inst/**'
      - 'man/**'
      - 'data/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'app.R'
      - 'Dockerfile'
      - 'compose.yml'
      - '.github/workflows/docker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      ghcr_image: ghcr.io/landrise/landrise.app:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Determine image configuration
        id: config
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "image_name=shinypkg-app-prod" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "image_name=shinypkg-app-dev" >> $GITHUB_OUTPUT
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jimbrig/shinypkg


      - name: Build and Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/jimbrig/shinypkg
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Docker Build Details
        run: |
          echo "🏗️ Build completed successfully!"
          echo "📦 GHCR Image: ghcr.io/jimbrig/shinypkg:${{ github.sha }}"
          echo "🌍 Environment: ${{ steps.config.outputs.environment }}"
          echo "📋 Image Digest: ${{ steps.push.outputs.digest }}"
